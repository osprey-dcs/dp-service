name: release-image

on:
  push:
    # rel-* only, matching release.yml (#221 plan D4).  This used to be '*', so any tag push --
    # including a throwaway one -- published an image and moved `latest`.  A push runs the
    # workflow file at the tagged commit, so a tag on a commit from before this change still
    # runs the old trigger: never push a tag to rehearse.
    tags:
      - 'rel-*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag to build from (e.g., v1.2.3). If omitted the workflow will use the current ref/commit.'
        required: false
        default: ''
      # Optional ref (branch or tag or commit) to checkout instead of treating the input as a tag
      ref:
        description: 'Optional git ref (branch, tag, or commit) to checkout for the build — useful for testing'
        required: false
        default: ''
      # Empty by default so the POM's rel-<dp-grpc.version> is reachable (#221 plan D6); with a
      # 'main' default that branch of the resolver was dead code.  Type 'main' to get main.
      dp_grpc_ref:
        description: 'dp-grpc git ref (branch, tag, or full commit SHA). Empty: rel-<dp-grpc.version> from the POM, else main'
        required: false
        default: ''
      image_tag:
        description: 'Image tag to push (defaults to the git tag or commit SHA if no tag provided). Not latest or rel-*'
        required: false
        default: ''
      dry_run:
        description: 'Build and test only; do not log in to ghcr.io, push, or sign the image'
        required: false
        type: boolean
        default: true

# A publish must never be cancelled halfway through; stated explicitly, as in release.yml.
concurrency:
  group: release-image-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

# Two jobs, for the same reason release.yml has three (#221 plan D1/D2): the job that runs the
# test suite -- every Maven plugin, and a dp-grpc build from another repository -- never holds the
# registry-write token or the OIDC signing token.  `publish-image` holds both, because `cosign
# sign` writes the signature to the registry, and runs no project code on the runner: the Maven
# build inside the Dockerfile runs in BuildKit, which does not inherit the runner's environment.
#
# The source is pinned across the split.  Each job would otherwise check out a ref NAME, and a
# branch (or dp-grpc main) moving between the two would let `needs: test` gate source other than
# what is built, pushed and signed.  `test` resolves both repositories to commits and
# `publish-image` builds exactly those, resolving nothing itself.
#
# What `needs: test` proves is that the SOURCE passed `mvn test`.  The image is a separate
# -DskipTests build inside BuildKit; it is gated on its source's tests, not itself tested.
env:
  # The single definition of "this run is a real release", the same expression as
  # release.yml's.  It is keyed off the EVENT, not github.ref_type: a workflow_dispatch can
  # target a tag, and a ref-type check would treat that dispatch as a release and move
  # `latest` (the defect dp-grpc#137's review found in dp-grpc's workflow).
  IS_RELEASE: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/rel-') }}
  # A dry run builds and tests the image but never logs in to ghcr.io, pushes, or signs it, so
  # the workflow can be exercised without publishing.  A tag push always publishes; a manual
  # dispatch defaults to a dry run and must opt in to pushing.  Defined once here rather than as
  # separate step-level conditions so they cannot drift apart.
  DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      JAVA_VERSION: '21'
      DP_GRPC_REPO: 'https://github.com/osprey-dcs/dp-grpc.git'
    outputs:
      commit: ${{ steps.source.outputs.commit }}
      dp_grpc_commit: ${{ steps.grpc.outputs.commit }}
    steps:
      # Before anything else, so a refused run costs seconds.  A dispatch that pushes signs
      # under the identity release-image.yml@<github.ref>; against a TAG ref that is
      # refs/tags/rel-<version>, the release's own identity, differing only in the workflow
      # trigger.  The published verify command pins the trigger too, so this is defense in depth,
      # as in release.yml.  A publishing dispatch may not use the ref/tag inputs either: the
      # certificate records the dispatch commit (GITHUB_SHA) as its source, so building anything
      # else would sign a false source claim.  Nor may its image tag -- image_tag, or tag when
      # image_tag is empty, exactly as IMAGE_TAG resolves in publish-image -- name `latest` or a
      # release tag: pushing either would repoint a tag consumers pull at something that was never
      # released, whether or not its signature verifies.  A dry run signs and pushes nothing and
      # may use every input.  These are the fast-fail copies; publish-image re-checks the values it
      # actually uses before logging in, without trusting this job's outputs.
      - name: Refuse a publishing dispatch that could pose as a release
        if: github.event_name == 'workflow_dispatch' && env.DRY_RUN != 'true'
        env:
          REQUESTED_REF: ${{ inputs.ref }}
          REQUESTED_TAG: ${{ inputs.tag }}
          REQUESTED_IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "::error::Refusing to publish from a dispatch against tag ${GITHUB_REF_NAME}: its signature would carry the release identity. Dispatch against a branch, or run with dry_run."
            exit 1
          fi
          if [ -n "$REQUESTED_REF" ] || [ -n "$REQUESTED_TAG" ]; then
            echo "::error::Refusing the ref/tag inputs on a publishing dispatch: the signature names the dispatch commit ${GITHUB_SHA} as its source, so only that commit may be built. Dispatch against a branch at the commit to publish, or run with dry_run."
            exit 1
          fi
          case "${REQUESTED_IMAGE_TAG:-$REQUESTED_TAG}" in
            latest|rel-*)
              echo "::error::Refusing image tag '${REQUESTED_IMAGE_TAG:-$REQUESTED_TAG}' on a dispatch: 'latest' and 'rel-*' image tags are published only by a rel-* tag push."
              exit 1 ;;
          esac

      - name: Checkout repository
        # Actions are pinned to commit SHAs rather than floating major tags; Dependabot
        # (.github/dependabot.yml) keeps the pins current.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          # On a dispatch: inputs.ref (branch, tag or commit) if given, else inputs.tag as
          # refs/tags/<tag>.  Otherwise github.sha, NOT github.ref: the signing certificate records
          # github.sha as its source commit, and github.ref is a name that can move after the run
          # is queued.  The #221 PR 2 rehearsal checked out github.ref, the branch moved first, and
          # the signature named b169084 for an image built from 6ca6c73.  (With a ref/tag input the
          # certificate would still name the dispatch commit, so a publishing dispatch refuses both
          # inputs above: they are for dry runs.)
          ref: ${{ github.event_name == 'workflow_dispatch' && (inputs.ref != '' && inputs.ref || (inputs.tag != '' && format('refs/tags/{0}', inputs.tag))) || github.sha }}

      # The commit publish-image builds.  On any run that signs it must be GITHUB_SHA, the commit
      # the signing certificate records as its source.  The checkout above already takes
      # github.sha there; this assertion keeps that true if the ref expression is edited.
      # publish-image makes the same check itself.
      - name: Record source commit
        id: source
        run: |
          COMMIT=$(git rev-parse HEAD)
          if [ "${DRY_RUN}" != "true" ] && [ "$COMMIT" != "${GITHUB_SHA}" ]; then
            echo "::error::Checked-out commit $COMMIT is not ${GITHUB_SHA}, the commit the signature would name."
            exit 1
          fi
          echo "dp-service commit: $COMMIT"
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"

      - name: Set up JDK
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'maven'

      # #221 plan D6, the same rules as release.yml:
      #   release  -- strictly rel-<version>, and the tag must match the POM's project.version and
      #               dp-grpc.version.  No fallback: the image and the jar are both built against
      #               the dp-grpc release their tag names, or neither is published.
      #   dispatch -- an explicit dp_grpc_ref (an error if it does not exist), else
      #               rel-<dp-grpc.version>, else main, logged.
      # The resolved ref is then peeled to a commit, which is what publish-image builds.  Inputs
      # reach the script through env only, never ${{ }}-spliced into it.
      - name: Resolve dp-grpc commit
        id: grpc
        env:
          REQUESTED_DP_GRPC_REF: ${{ inputs.dp_grpc_ref }}
        run: |
          set -euo pipefail
          WANT=$(mvn -B -q -DforceStdout help:evaluate -Dexpression=dp-grpc.version)
          if [ "${IS_RELEASE}" = "true" ]; then
            VERSION="${GITHUB_REF_NAME#rel-}"
            POM_VERSION=$(mvn -B -q -DforceStdout help:evaluate -Dexpression=project.version)
            if [ "$VERSION" != "$POM_VERSION" ] || [ "$VERSION" != "$WANT" ]; then
              echo "::error::Tag ${GITHUB_REF_NAME} does not match the POM (project.version $POM_VERSION, dp-grpc.version $WANT). Bump the POM and retag."
              exit 1
            fi
            REF="rel-$VERSION"
          elif [ -n "$REQUESTED_DP_GRPC_REF" ]; then
            REF="$REQUESTED_DP_GRPC_REF"
          elif git ls-remote --exit-code "$DP_GRPC_REPO" "refs/tags/rel-$WANT" >/dev/null 2>&1; then
            REF="rel-$WANT"
          else
            echo "::warning::dp-grpc has no tag rel-$WANT; building against main"
            REF="main"
          fi

          if printf '%s' "$REF" | grep -Eq '^[0-9a-f]{40}$'; then
            COMMIT="$REF"   # already a commit; the dp-grpc checkout below fails if it is unreachable
          else
            # Tag first, then branch.  An annotated tag's own line is the tag object; its peeled
            # ^{} line is the commit, so prefer that when present.
            LINES=$(git ls-remote "$DP_GRPC_REPO" "refs/tags/$REF" "refs/tags/$REF^{}" "refs/heads/$REF")
            COMMIT=$(printf '%s\n' "$LINES" | awk -v r="refs/tags/$REF^{}" '$2 == r { print $1 }')
            [ -n "$COMMIT" ] || COMMIT=$(printf '%s\n' "$LINES" | awk -v r="refs/tags/$REF" '$2 == r { print $1 }')
            [ -n "$COMMIT" ] || COMMIT=$(printf '%s\n' "$LINES" | awk -v r="refs/heads/$REF" '$2 == r { print $1 }')
            if [ -z "$COMMIT" ]; then
              echo "::error::dp-grpc ref '$REF' does not exist in $DP_GRPC_REPO"
              exit 1
            fi
          fi
          echo "dp-grpc: $REF -> $COMMIT (pom requires $WANT)"
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"

      # Same step as ci.yml; see its comment and third-party/cisd-jhdf5/README.md.
      # Without it this build resolves jhdf5 and cisd:base from maven.scijava.org and
      # fails whenever that host is down or serves 503 for JARs.
      #
      # Guarded, unlike ci.yml and release.yml: a manual dispatch runs this workflow file from
      # the dispatching branch but checks out inputs.ref/inputs.tag, so rebuilding the image of
      # a release older than the script (rel-1.16.0 and earlier) must still work. Such a build
      # resolves from SciJava exactly as it did when that release was cut.
      - name: Install vendored cisd:jhdf5 and cisd:base to local Maven repo
        run: |
          if [ -x third-party/install-vendored.sh ]; then
            third-party/install-vendored.sh
          else
            echo "::warning::third-party/install-vendored.sh not in the checked-out ref; this build resolves cisd:jhdf5 and cisd:base from maven.scijava.org"
          fi

      - name: Checkout dp-grpc dependency
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: 'osprey-dcs/dp-grpc'
          path: dp-grpc
          ref: ${{ steps.grpc.outputs.commit }}
          persist-credentials: false

      - name: Build and install dp-grpc to local Maven repo
        working-directory: dp-grpc
        run: |
          mvn -B -DskipTests install

      - name: Diagnostic - show workspace and repo state
        run: |
          echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
          echo "GITHUB_REF=${GITHUB_REF}"
          echo "GITHUB_EVENT_NAME=${GITHUB_EVENT_NAME}"
          echo "GITHUB_REF_TYPE=${GITHUB_REF_TYPE}"
          echo "GITHUB_REF_NAME=${GITHUB_REF_NAME}"
          echo "Listing workspace root:"
          pwd
          ls -la
          echo "Git status/branch/tag info:"
          git rev-parse --abbrev-ref HEAD || true
          git describe --tags --exact-match || echo "(not a tag)"
          echo "Files changed in HEAD (first 200 lines):"
          git show --name-only --pretty="" HEAD | sed -n '1,200p' || true
          if [ ! -f "$GITHUB_WORKSPACE/docker-compose.yaml" ]; then
            echo "ERROR: docker-compose.yaml not found at $GITHUB_WORKSPACE/docker-compose.yaml"
            echo "This usually means the checked-out ref does not contain the compose file."
            echo "If you triggered a dry run with the 'ref' or 'tag' input, choose a ref that contains the repository files, e.g.:"
            echo "  gh workflow run release-image.yml --ref <branch> --field ref=<branch-tag-or-commit>"
            echo "A publishing dispatch cannot use those inputs; it builds the dispatch commit (--ref <branch>)."
            exit 1
          fi

      - name: Start Docker Compose
        run: |
          docker compose -f "$GITHUB_WORKSPACE/docker-compose.yaml" up -d

      - name: Wait for mongodb to be healthy
        run: |
          for i in {1..30}; do
            STATUS=$(docker inspect dp-mongodb --format '{{json .State.Health.Status}}' 2>/dev/null || echo null)
            echo "mongodb status: $STATUS"
            if echo "$STATUS" | grep -iq healthy; then
              echo "mongodb healthy"
              exit 0
            fi
            sleep 2
          done
          echo "mongodb did not become healthy" >&2
          docker compose logs mongodb || true
          exit 1

      # Unit tests only: the integration tests are a separate source root run by Failsafe under
      # `mvn verify`, which `test` does not run.  On a release, release.yml runs the full verify
      # on the same commit; a dispatch gets this gate alone.
      - name: Run Maven unit tests
        run: |
          mvn -B test
        env:
          # Align with src/main/resources/application.yml
          DP_MONGO_DB_HOST: localhost
          DP_MONGO_DB_PORT: "27017"
          DP_MONGO_DB_USER: admin
          DP_MONGO_DB_PASSWORD: admin

      - name: Tear down services
        if: always()
        run: |
          docker compose -f "$GITHUB_WORKSPACE/docker-compose.yaml" down -v || true

  publish-image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # push the image, and cosign's signature beside it
      id-token: write   # Sigstore keyless OIDC
    env:
      # IMAGE_TAG resolution priority:
      # 1) explicit inputs.image_tag (manual override; `latest` and rel-* refused in test)
      # 2) on a release (IS_RELEASE), the tag name
      # 3) if inputs.tag was provided (manual dispatch; a dry run only, since a publishing
      #    dispatch refuses the tag input), use that
      # 4) fallback to commit SHA
      # Step 2 spells out IS_RELEASE's expression because an env block cannot read the
      # workflow-level entry; keep the two copies identical.
      IMAGE_TAG: ${{ inputs.image_tag != '' && inputs.image_tag || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/rel-') && github.ref_name) || (inputs.tag != '' && inputs.tag) || github.sha }}
      IMAGE: ghcr.io/${{ github.repository_owner }}/dp-service
    steps:
      # The authoritative copies of test's refusals, on the values this job actually uses.  This
      # job runs no project code, so these hold even if the job that ran Maven handed over
      # something unexpected: whatever is signed is GITHUB_SHA, the commit the certificate names,
      # and only a release pushes `latest` or a rel-* tag.
      - name: Check what is about to be published
        if: env.DRY_RUN != 'true'
        env:
          COMMIT: ${{ needs.test.outputs.commit }}
        run: |
          if [ "$COMMIT" != "$GITHUB_SHA" ]; then
            echo "::error::Refusing to publish commit '$COMMIT': the signature names ${GITHUB_SHA} as its source."
            exit 1
          fi
          if [ "$IS_RELEASE" != "true" ]; then
            case "$IMAGE_TAG" in
              latest|rel-*)
                echo "::error::Refusing to push image tag '$IMAGE_TAG': 'latest' and 'rel-*' are published only by a rel-* tag push."
                exit 1 ;;
            esac
          fi

      # The tested commit, never a ref name (see the comment above `jobs:`).  No credentials are
      # persisted: the Dockerfile copies the whole build context, .git included, into its builder
      # stage, and this job's token can write packages.
      - name: Checkout tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.test.outputs.commit }}
          persist-credentials: false

      - name: Log in to GitHub Container Registry
        # Skipped on a dry run, so the registry credential never reaches the runner.
        if: env.DRY_RUN != 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        id: build
        # Always builds -- that is what exercises the Dockerfile and this action.  Only the
        # push is conditional, so a dry run still proves the image builds.
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          push: ${{ env.DRY_RUN != 'true' }}
          # `latest` is published only on a release (IS_RELEASE), never from a dispatch -- not
          # even one whose ref is a tag.  A manual dispatch builds an arbitrary ref with an
          # arbitrary image_tag, and moving `latest` to that would repoint the tag most
          # consumers pull at something that was never released.
          tags: |
            ${{ env.IMAGE }}:${{ env.IMAGE_TAG }}
            ${{ env.IS_RELEASE == 'true' && format('{0}:latest', env.IMAGE) || '' }}
          # The dp-grpc COMMIT test built and tested against; the Dockerfile fetches it with no
          # fallback, so an unreachable commit fails the build rather than changing it.
          build-args: |
            DP_GRPC_REPO=https://github.com/osprey-dcs/dp-grpc.git
            DP_GRPC_REF=${{ needs.test.outputs.dp_grpc_commit }}

      # Pinned to the same cosign as release.yml; see the comment there.
      - name: Install cosign
        if: env.DRY_RUN != 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.0.6'

      # By digest, never by tag: `latest` and rel-* tags are mutable, and one signature on the
      # digest covers every tag that points at it.  The digest is checked first so an empty
      # output fails here instead of signing `dp-service@`.  One retry: a dropped connection to
      # a Sigstore service (seen on #221 PR 1's rehearsal, at the timestamp authority) should not
      # leave a released image unsigned.  A retry that follows a partial success only adds a
      # second valid signature.
      - name: Sign image
        if: env.DRY_RUN != 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$DIGEST" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
            echo "::error::build-push-action returned no usable digest ('$DIGEST'); refusing to sign"
            exit 1
          fi
          echo "Signing $IMAGE@$DIGEST"
          cosign sign --yes "$IMAGE@$DIGEST" || {
            echo "::warning::cosign sign failed; retrying once in 30s"
            sleep 30
            cosign sign --yes "$IMAGE@$DIGEST"
          }
