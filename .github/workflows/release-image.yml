name: release-image

on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag to build from (e.g., v1.2.3). If omitted the workflow will use the current ref/commit.'
        required: false
        default: ''
      # Optional ref (branch or tag or commit) to checkout instead of treating the input as a tag
      ref:
        description: 'Optional git ref (branch, tag, or commit) to checkout for the build — useful for testing'
        required: false
        default: ''
      dp_grpc_ref:
        description: 'dp-grpc git ref (branch, tag, or commit) used during build'
        required: false
        default: 'main'
      image_tag:
        description: 'Image tag to push (defaults to the git tag or commit SHA if no tag provided)'
        required: false
        default: ''
      dry_run:
        description: 'Build and test only; do not log in to ghcr.io or push the image'
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

jobs:
  build-test-and-publish:
    runs-on: ubuntu-latest
    env:
      JAVA_VERSION: '21'
      DP_GRPC_REPO: 'https://github.com/osprey-dcs/dp-grpc.git'
      # IMAGE_TAG resolution priority:
      # 1) explicit inputs.image_tag (manual override)
      # 2) if workflow is triggered on a tag, use the tag name
      # 3) if inputs.tag was provided (manual dispatch), use that
      # 4) fallback to commit SHA
      IMAGE_TAG: ${{ inputs.image_tag != '' && inputs.image_tag || (github.ref_type == 'tag' && github.ref_name) || (inputs.tag != '' && inputs.tag) || github.sha }}
      # A dry run builds and tests the image but never logs in to ghcr.io or pushes it, so
      # the workflow can be exercised without publishing.  A tag push always publishes; a
      # manual dispatch defaults to a dry run and must opt in to pushing.  Defined once
      # here rather than as separate step-level conditions so the two cannot drift apart.
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
    steps:
      - name: Checkout repository at tag
        # Actions are pinned to commit SHAs rather than floating major tags: this job holds
        # ghcr.io registry credentials and publishes the public image, so a compromised
        # upstream tag here could push an image users pull.  Dependabot
        # (.github/dependabot.yml) keeps the pins current.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # On push: github.ref already points to the tag; on manual: checkout refs/tags/<input>
          # If workflow_dispatch and a ref input is provided, use it directly (branch or tag or commit); otherwise
          # for a manual run treat inputs.ref (branch/commit) first, then inputs.tag as a tag ref; for push events use github.ref
          ref: ${{ github.event_name == 'workflow_dispatch' && (inputs.ref != '' && inputs.ref || (inputs.tag != '' && format('refs/tags/{0}', inputs.tag))) || github.ref }}

      - name: Set up JDK
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'maven'

      - name: Cache Docker layers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: docker-cache
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Resolve dp-grpc ref
        id: grpc
        env:
          CANDIDATE: ${{ inputs.dp_grpc_ref != '' && inputs.dp_grpc_ref || (github.ref_type == 'tag' && github.ref_name) || inputs.tag }}
        run: |
          WANT=$(sed -n 's:.*<dp-grpc.version>\(.*\)</dp-grpc.version>.*:\1:p' pom.xml)
          if [ -n "$CANDIDATE" ] && git ls-remote --exit-code "$DP_GRPC_REPO" "refs/tags/$CANDIDATE" "refs/heads/$CANDIDATE" >/dev/null 2>&1; then
            REF="$CANDIDATE"
          elif [ -n "${{ inputs.dp_grpc_ref }}" ]; then
            echo "ERROR: requested dp_grpc_ref '$CANDIDATE' does not exist in $DP_GRPC_REPO" >&2
            exit 1
          elif git ls-remote --exit-code "$DP_GRPC_REPO" "refs/tags/rel-$WANT" >/dev/null 2>&1; then
            REF="rel-$WANT"
          else
            REF="main"
          fi
          echo "dp-grpc ref: $REF (candidate '$CANDIDATE', pom requires $WANT)"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"

      - name: Checkout dp-grpc dependency
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: 'osprey-dcs/dp-grpc'
          path: dp-grpc
          ref: ${{ steps.grpc.outputs.ref }}
          fetch-depth: 0

      - name: Build and install dp-grpc to local Maven repo
        working-directory: dp-grpc
        run: |
          mvn -B -DskipTests install

      - name: Diagnostic - show workspace and repo state
        run: |
          echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
          echo "GITHUB_REF=${GITHUB_REF}"
          echo "GITHUB_EVENT_NAME=${GITHUB_EVENT_NAME}"
          echo "github.ref_type=${{ github.ref_type }}"
          echo "github.ref_name=${{ github.ref_name }}"
          echo "Listing workspace root:"
          pwd
          ls -la
          echo "Git status/branch/tag info:"
          git rev-parse --abbrev-ref HEAD || true
          git describe --tags --exact-match || echo "(not a tag)"
          echo "Files changed in HEAD (first 200 lines):"
          git show --name-only --pretty="" HEAD | sed -n '1,200p' || true
          if [ ! -f "$GITHUB_WORKSPACE/docker-compose.yaml" ]; then
            echo "ERROR: docker-compose.yaml not found at $GITHUB_WORKSPACE/docker-compose.yaml"
            echo "This usually means the checked-out ref does not contain the compose file."
            echo "If you triggered a manual run, set the 'ref' input to a branch or tag that contains the repository files, e.g.:"
            echo "  gh workflow run release-image.yml --ref feature/your-branch --field tag=v1.11 --field ref=feature/your-branch"
            echo "Or push a temporary branch based on main that contains .github/workflows/release-image.yml and docker-compose.yaml."
            exit 1
          fi

      - name: Start Docker Compose
        run: |
          docker compose -f "$GITHUB_WORKSPACE/docker-compose.yaml" up -d

      - name: Wait for mongodb to be healthy
        run: |
          for i in {1..30}; do
            STATUS=$(docker inspect dp-mongodb --format '{{json .State.Health.Status}}' 2>/dev/null || echo null)
            echo "mongodb status: $STATUS"
            if echo "$STATUS" | grep -iq healthy; then
              echo "mongodb healthy"
              exit 0
            fi
            sleep 2
          done
          echo "mongodb did not become healthy" >&2
          docker compose logs mongodb || true
          exit 1

      - name: Run Maven tests (integration/unit)
        run: |
          mvn -B test
        env:
          # Align with src/main/resources/application.yml
          DP_MONGO_DB_HOST: localhost
          DP_MONGO_DB_PORT: "27017"
          DP_MONGO_DB_USER: admin
          DP_MONGO_DB_PASSWORD: admin

      - name: Log in to GitHub Container Registry
        # Skipped on a dry run, so the registry credential never reaches the runner.
        if: success() && env.DRY_RUN != 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        # Always builds -- that is what exercises the Dockerfile and this action.  Only the
        # push is conditional, so a dry run still proves the image builds.
        if: success()
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          push: ${{ env.DRY_RUN != 'true' }}
          # `latest` is published only from a real tag push.  A manual dispatch builds an
          # arbitrary ref with an arbitrary image_tag, and moving `latest` to that would
          # repoint the tag most consumers pull at something that was never released.
          tags: |
            ghcr.io/${{ github.repository_owner }}/dp-service:${{ env.IMAGE_TAG }}
            ${{ github.ref_type == 'tag' && format('ghcr.io/{0}/dp-service:latest', github.repository_owner) || '' }}
          build-args: |
            DP_GRPC_REPO=${{ env.DP_GRPC_REPO }}
            DP_GRPC_REF=${{ steps.grpc.outputs.ref }}

      - name: Tear down services
        if: always()
        run: |
          docker compose -f "$GITHUB_WORKSPACE/docker-compose.yaml" down -v || true
