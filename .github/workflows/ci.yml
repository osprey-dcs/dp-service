name: CI

on:
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  packages: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      JAVA_VERSION: '21'
      DP_GRPC_REPO: 'https://github.com/osprey-dcs/dp-grpc.git'
      IMAGE_NAME: 'dp-service-ci'
      # Use a fixed dp-grpc ref for CI PR runs
      DP_GRPC_REF: 'main'
    steps:
      - name: Checkout this repository
        # Actions are pinned to commit SHAs rather than floating major tags: a mutable tag
        # can be repointed by whoever controls the action's repo, and every run would pick
        # up the new code with no diff and no review.  Dependabot (.github/dependabot.yml)
        # keeps the pins current.
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'maven'

      - name: Cache Docker layers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: docker-cache
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Checkout dp-grpc dependency
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: 'osprey-dcs/dp-grpc'
          path: dp-grpc
          ref: ${{ env.DP_GRPC_REF }}
          fetch-depth: 0

      # cisd:jhdf5 is not published to Maven Central, and its only upstream host
      # (maven.scijava.org) has served 503 for JAR downloads while continuing to serve
      # POMs, which broke every CI run that could not restore a Maven cache.  Actions
      # caches are scoped per-ref, so no PR can reuse another PR's cache -- CI had been
      # relying on downloading this jar fresh each run.  The jar is vendored under
      # third-party/ and installed here so the build no longer depends on that host.
      # See third-party/cisd-jhdf5/README.md before removing this step.
      - name: Install vendored cisd:jhdf5 to local Maven repo
        run: |
          mvn -B install:install-file \
            -Dfile=third-party/cisd-jhdf5/jhdf5-19.04.1.jar \
            -DpomFile=third-party/cisd-jhdf5/jhdf5-19.04.1.pom

      - name: Build and install dp-grpc to local Maven repo
        working-directory: dp-grpc
        run: |
          mvn -B -DskipTests install

      - name: Start MongoDB with Docker Compose
        run: |
          # start the needed backends to execute the tests
          docker compose -f docker-compose.yaml up -d

      - name: Wait for mongodb to be healthy
        run: |
          for i in {1..30}; do
            STATUS=$(docker inspect dp-mongodb --format '{{json .State.Health.Status}}' 2>/dev/null || echo null)
            echo "mongodb status: $STATUS"
            if echo "$STATUS" | grep -iq healthy; then
              echo "mongodb healthy"
              exit 0
            fi
            sleep 2
          done
          echo "mongodb did not become healthy" >&2
          docker compose logs mongodb || true
          exit 1

      - name: Run Maven tests (integration/unit)
        run: |
          mvn -B test
        env:
          # Align with src/main/resources/application.yml
          DP_MONGO_DB_HOST: localhost
          DP_MONGO_DB_PORT: "27017"
          DP_MONGO_DB_USER: admin
          DP_MONGO_DB_PASSWORD: admin

      - name: Collect logs (always)
        if: always()
        run: |
          docker compose -f docker-compose.yaml logs --no-color > compose-logs.txt || true
          echo "---- docker ps ----"
          docker ps --no-trunc > docker-ps.txt || true
          tar -czf logs.tar.gz compose-logs.txt docker-ps.txt || true
        shell: bash

      - name: Upload logs artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: docker-logs
          path: |
            compose-logs.txt
            docker-ps.txt
            logs.tar.gz

      - name: Tear down services
        if: always()
        run: |
          docker compose -f docker-compose.yaml down -v
