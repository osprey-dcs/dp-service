name: CI

on:
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened]
  # Runs on main catch breakage from PRs that each passed alone but conflict once merged, and
  # create the Maven cache PRs can restore (Actions caches are scoped per ref, and a PR can read
  # only its own and the default branch's).
  push:
    branches: [ main ]

permissions:
  contents: read

# A new push to a PR cancels that PR's superseded run. PR runs key on github.ref
# (refs/pull/<n>/merge), unique per PR; head_ref is only the branch name, which fork PRs can share.
# Push runs key on the SHA so they never share a group: a group holds one pending run and a newer
# one replaces it even without cancel-in-progress, which would leave middle merges untested.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      JAVA_VERSION: '21'
      DP_GRPC_REPO: 'https://github.com/osprey-dcs/dp-grpc.git'
      # Use a fixed dp-grpc ref for CI runs
      DP_GRPC_REF: 'main'
    steps:
      - name: Checkout this repository
        # Actions are pinned to commit SHAs rather than floating major tags: a mutable tag
        # can be repointed by whoever controls the action's repo, and every run would pick
        # up the new code with no diff and no review.  Dependabot (.github/dependabot.yml)
        # keeps the pins current.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'maven'

      # Make maven.scijava.org unreachable for the whole job, so every build proves it does not
      # need that host (#250 Task 4). The pom still lists the sci-java repository, and Maven
      # falls through a refused connection to Central, so only an artifact that SciJava alone
      # hosts fails -- which is exactly a dependency that must be vendored under third-party/
      # and added to install-vendored.sh. Without this, CI resolves such a dependency from
      # SciJava and stays green until the next outage, which is how cisd:base went unnoticed.
      # A restored Maven cache cannot mask a new dependency: no run with this step can
      # download from SciJava, and a cache saved before it existed holds only dependencies
      # the pom already had, which a blocked-host Docker build showed resolve without it.
      - name: Block maven.scijava.org
        run: |
          printf '127.0.0.1 maven.scijava.org\n::1 maven.scijava.org\n' | sudo tee -a /etc/hosts
          getent hosts maven.scijava.org | grep -Eq '^(127\.0\.0\.1|::1)[[:space:]]' || {
            echo "::error::maven.scijava.org still resolves to a real address; the block is not effective"
            exit 1
          }

      # cisd:jhdf5 is not published to Maven Central, and its only upstream host
      # (maven.scijava.org) has served 503 for JAR downloads while continuing to serve
      # POMs, which broke every CI run that could not restore a Maven cache.  Actions
      # caches are scoped per-ref, so no PR can reuse another PR's cache -- CI had been
      # relying on downloading this jar fresh each run.  The jar is vendored under
      # third-party/ (with cisd:base, also SciJava-only) and installed here so the build
      # no longer depends on that host.
      # See third-party/cisd-jhdf5/README.md before removing this step.
      - name: Install vendored cisd:jhdf5 and cisd:base to local Maven repo
        run: third-party/install-vendored.sh

      - name: Checkout dp-grpc dependency
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: 'osprey-dcs/dp-grpc'
          path: dp-grpc
          ref: ${{ env.DP_GRPC_REF }}
          fetch-depth: 0

      - name: Build and install dp-grpc to local Maven repo
        working-directory: dp-grpc
        run: |
          mvn -B -DskipTests install

      # --wait blocks until the healthcheck in docker-compose.yaml reports healthy, and fails if it
      # reports unhealthy. The timeout must stay above the time the healthcheck needs to reach a
      # verdict: Docker starts each probe `interval` after the previous one completes, and a probe
      # can run for its full `timeout`, so the worst case is about
      # start_period + retries * (interval + timeout) (110 s today). Below that, a slow start that
      # would have passed fails as a timeout instead. Re-check it when changing the healthcheck.
      - name: Start MongoDB with Docker Compose
        run: |
          if ! docker compose -f docker-compose.yaml up -d --wait --wait-timeout 180; then
            echo "mongodb did not become healthy" >&2
            docker compose -f docker-compose.yaml logs mongodb || true
            exit 1
          fi

      # verify runs the unit tests (Surefire) and the integration tests (Failsafe). The job id
      # build-and-test is what the main ruleset's required status check matches (#250 Task 7), so
      # renaming the job must update the ruleset in the same change.
      - name: Unit and integration tests (mvn verify)
        run: |
          mvn -B verify
        env:
          # Align with src/main/resources/application.yml
          DP_MONGO_DB_HOST: localhost
          DP_MONGO_DB_PORT: "27017"
          DP_MONGO_DB_USER: admin
          DP_MONGO_DB_PASSWORD: admin

      - name: Collect logs (always)
        if: always()
        run: |
          docker compose -f docker-compose.yaml logs --no-color > compose-logs.txt || true
          echo "---- docker ps ----"
          docker ps --no-trunc > docker-ps.txt || true
          tar -czf logs.tar.gz compose-logs.txt docker-ps.txt || true
        shell: bash

      - name: Upload logs artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docker-logs
          path: |
            compose-logs.txt
            docker-ps.txt
            logs.tar.gz

      # With the integration tests in the PR check (and, once it is a required check, gating the
      # merge), which test failed and why has to be answerable from the PR.
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-reports
          path: |
            target/surefire-reports
            target/failsafe-reports
          if-no-files-found: ignore

      - name: Tear down services
        if: always()
        run: |
          docker compose -f docker-compose.yaml down -v
