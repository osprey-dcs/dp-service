name: Release dp-service

on:
  push:
    tags:
      - 'rel-*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    env:
      JAVA_VERSION: '21'
      DP_GRPC_REPO: 'osprey-dcs/dp-grpc'

    steps:
      - name: Checkout dp-service at tag
        # Actions are pinned to commit SHAs rather than floating major tags: this job runs
        # with `contents: write` and publishes release artifacts, so a compromised upstream
        # tag here could replace what users download.  Dependabot (.github/dependabot.yml)
        # keeps the pins current.
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Derive version from tag
        id: version
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#rel-}"
          if [[ "$VERSION" == "$TAG" ]]; then
            echo "ERROR: tag does not start with 'rel-': $TAG"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Checkout dp-grpc at matching tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ env.DP_GRPC_REPO }}
          path: dp-grpc
          ref: ${{ steps.version.outputs.tag }}
          fetch-depth: 0

      - name: Build and install dp-grpc
        working-directory: dp-grpc
        run: |
          mvn -B -DskipTests install

      - name: Start MongoDB (for tests)
        run: |
          docker compose -f docker-compose.yaml up -d

      - name: Wait for MongoDB to be healthy
        run: |
          for i in {1..30}; do
            STATUS=$(docker inspect dp-mongodb --format '{{.State.Health.Status}}' 2>/dev/null || echo "")
            echo "mongodb status: $STATUS"
            if [[ "$STATUS" == "healthy" ]]; then
              exit 0
            fi
            sleep 2
          done
          echo "MongoDB did not become healthy"
          docker compose logs mongodb || true
          exit 1

      - name: Build and test dp-service
        env:
          DP_MONGO_DB_HOST: localhost
          DP_MONGO_DB_PORT: "27017"
          DP_MONGO_DB_USER: admin
          DP_MONGO_DB_PASSWORD: admin
        run: |
          mvn -B clean verify

      - name: Tear down services
        if: always()
        run: |
          docker compose -f docker-compose.yaml down -v || true

      - name: Prepare release artifacts
        run: |
          mkdir -p release
          SHADED_JAR=$(ls target/dp-service-*-shaded.jar)
          cp "$SHADED_JAR" "release/dp-service-${VERSION}.jar"

      - name: Verify release artifacts
        run: |
          test -f "release/dp-service-${VERSION}.jar" || \
            (echo "Missing dp-service-${VERSION}.jar" && exit 1)

      - name: Generate checksum
        run: |
          sha256sum release/dp-service-${VERSION}.jar \
            > release/dp-service-${VERSION}.jar.sha256

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            release/dp-service-${{ env.VERSION }}.jar
            release/dp-service-${{ env.VERSION }}.jar.sha256
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
