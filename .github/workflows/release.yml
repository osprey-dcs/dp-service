name: Release dp-service

on:
  push:
    tags:
      - 'rel-*'
  # Rehearsal trigger.  A workflow_dispatch run builds, tests, and signs, but the publish
  # job below is gated on a rel-* tag push, so a rehearsal is structurally incapable of
  # publishing rather than relying on the operator not to.  Note that a rehearsal does sign
  # for real: it produces a permanent public Rekor entry naming the ref it ran against.
  #
  # Rehearse by dispatching against a branch (`gh workflow run release.yml --ref <branch>`).
  # The run executes the workflow file AS IT EXISTS AT THAT REF, so a PR branch rehearses the
  # PR's own copy (observed on #221's rehearsal, run 36067531985: the branch's three jobs ran,
  # not main's one).  That also means no ref whose copy lacks this trigger can be rehearsed.
  # Never push a tag to rehearse: a rel-* tag starts a real release, and a tag of any name on
  # a commit from before #221 still runs that commit's release-image.yml, which published an
  # image for every tag.  See CLAUDE.md "Releases".
  #
  # A dispatch against a TAG ref is refused (see "Derive version"): its signing identity would
  # be release.yml@refs/tags/rel-<version>, the release's own, leaving the workflow trigger as
  # the only thing in the certificate that tells the two apart.
  workflow_dispatch:

# A publish must never be cancelled halfway through, so unlike CI this pins
# cancel-in-progress off.  false is already the default; it is stated explicitly so the
# intent survives a later edit rather than living only in this comment.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

# Three jobs, so the Sigstore OIDC token never shares a job with project code (#221 plan D1).
# A job granted `id-token: write` exposes the token-request credentials to every one of its
# steps, and `build` runs the full test suite, every Maven plugin, and a dp-grpc build from
# another repository.  `sign` therefore has no checkout and runs nothing but sha256sum and
# cosign over what `build` uploaded.  This does not stop code in `build` from tampering with
# the jar before it is checksummed -- no job split can -- but it confines the signing identity
# to the artifacts `build` handed over, for the seconds `sign` takes.
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    outputs:
      version: ${{ steps.version.outputs.version }}

    env:
      JAVA_VERSION: '21'
      DP_GRPC_REPO: 'osprey-dcs/dp-grpc'
      # The single definition of "this run is a real release".  It must stay textually
      # identical to the publish job's `if:` below, which cannot read this env context; it is
      # repeated there rather than passed as a job output so that the job running project code
      # cannot decide whether publishing happens.  Every step that behaves differently for a
      # release keys off it.
      IS_RELEASE: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/rel-') }}

    steps:
      - name: Checkout dp-service
        # Actions are pinned to commit SHAs rather than floating major tags: this workflow
        # publishes release artifacts, so a compromised upstream tag here could replace what
        # users download.  Dependabot (.github/dependabot.yml) keeps the pins current.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      # The discriminator throughout this job is the EVENT, not the ref type: only a rel-* tag
      # push is a release, and that is exactly what gates the publish job below.  Keying off
      # GITHUB_REF_TYPE instead would misclassify a workflow_dispatch run against a tag as a
      # release.
      #
      # On a release the version comes from the tag.  A rehearsal has no rel- tag to strip, and
      # falling back to GITHUB_REF_NAME would build dp-service-main.jar, so the rehearsal would
      # exercise filenames no release ever uses.  Reading the POM instead means a rehearsal
      # produces the same names a release does.
      #
      # On a release the tag must agree with the POM on both project.version and
      # dp-grpc.version.  The jar is renamed to the tag's version whatever the POM says, and
      # dp-grpc is checked out at rel-<tag version> while Maven resolves the POM's
      # dp-grpc.version, so a tag pushed on an unbumped POM would otherwise publish and sign a
      # jar whose name, self-reported version, and dp-grpc dependency disagree.
      #
      # A rehearsal against a tag ref is refused outright: it would sign under the release's
      # own identity (release.yml@refs/tags/rel-...), distinguishable from the real release
      # only by the workflow trigger.  Rehearse against a branch.
      #
      # The version becomes a filename and is handed to the sign job, which holds the signing
      # token, so anything outside a plain version alphabet is rejected here.
      - name: Derive version
        id: version
        run: |
          set -euo pipefail
          POM_VERSION=$(mvn -B -q -DforceStdout help:evaluate -Dexpression=project.version)
          if [ "${IS_RELEASE}" = "true" ]; then
            VERSION="${GITHUB_REF_NAME#rel-}"
            POM_GRPC_VERSION=$(mvn -B -q -DforceStdout help:evaluate -Dexpression=dp-grpc.version)
            if [ "$VERSION" != "$POM_VERSION" ] || [ "$VERSION" != "$POM_GRPC_VERSION" ]; then
              echo "::error::Tag ${GITHUB_REF_NAME} does not match the POM (project.version=${POM_VERSION}, dp-grpc.version=${POM_GRPC_VERSION}). Bump the POM and retag."
              exit 1
            fi
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "::error::Refusing to rehearse against tag ${GITHUB_REF_NAME}: its signature would carry the release's own identity. Dispatch against a branch."
            exit 1
          else
            VERSION="$POM_VERSION"
          fi
          if ! [[ "$VERSION" =~ ^[0-9A-Za-z.+-]+$ ]]; then
            echo "::error::Refusing version '$VERSION': outside [0-9A-Za-z.+-]"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Release version: $VERSION (release run: $IS_RELEASE)"

      # Checked before the build rather than left to action-gh-release, which fails the job on
      # a missing body_path only after the multi-minute build, test, and upload steps have run.
      # Every release from 1.16.0 on ships notes; see CLAUDE.md "Releases".  Skipped on a
      # rehearsal, which publishes nothing and so has no release body to look for.
      - name: Verify release notes exist
        if: env.IS_RELEASE == 'true'
        run: |
          set -euo pipefail
          NOTES="doc/release-notes/${GITHUB_REF_NAME}.md"
          if [ ! -f "$NOTES" ]; then
            echo "::error::Release notes not found at $NOTES."
            echo "::error::Add the notes for ${VERSION} and re-run, or retag once they are on the tagged commit."
            exit 1
          fi
          echo "NOTES_PATH=$NOTES" >> "$GITHUB_ENV"

      # Same step as ci.yml; see its comment and third-party/cisd-jhdf5/README.md.
      # Without it this build resolves jhdf5 and cisd:base from maven.scijava.org and
      # fails whenever that host is down or serves 503 for JARs.
      - name: Install vendored cisd:jhdf5 and cisd:base to local Maven repo
        run: third-party/install-vendored.sh

      # A release builds strictly against dp-grpc's matching rel-${VERSION} tag: if dp-grpc
      # has not been tagged, the checkout below fails, and that failure is the dependency-order
      # check -- do not soften it.  A rehearsal has no such tag, so it uses the dp-grpc release
      # the POM depends on, or main if that tag does not exist, and says which.
      - name: Resolve dp-grpc ref
        id: grpc
        run: |
          set -euo pipefail
          if [ "${IS_RELEASE}" = "true" ]; then
            REF="rel-${VERSION}"
            echo "dp-grpc ref: $REF (release: strict match to the dp-service tag)"
          else
            WANT=$(mvn -B -q -DforceStdout help:evaluate -Dexpression=dp-grpc.version)
            if git ls-remote --exit-code "https://github.com/${DP_GRPC_REPO}.git" "refs/tags/rel-${WANT}" >/dev/null; then
              REF="rel-${WANT}"
              echo "dp-grpc ref: $REF (rehearsal: POM dp-grpc.version)"
            else
              REF="main"
              echo "::warning::dp-grpc tag rel-${WANT} (POM dp-grpc.version) does not exist; rehearsal falls back to dp-grpc main"
            fi
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"

      - name: Checkout dp-grpc
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.DP_GRPC_REPO }}
          path: dp-grpc
          ref: ${{ steps.grpc.outputs.ref }}
          fetch-depth: 0

      - name: Build and install dp-grpc
        working-directory: dp-grpc
        run: |
          mvn -B -DskipTests install

      - name: Start MongoDB (for tests)
        run: |
          docker compose -f docker-compose.yaml up -d

      - name: Wait for MongoDB to be healthy
        run: |
          for i in {1..30}; do
            STATUS=$(docker inspect dp-mongodb --format '{{.State.Health.Status}}' 2>/dev/null || echo "")
            echo "mongodb status: $STATUS"
            if [[ "$STATUS" == "healthy" ]]; then
              exit 0
            fi
            sleep 2
          done
          echo "MongoDB did not become healthy"
          docker compose logs mongodb || true
          exit 1

      - name: Build and test dp-service
        env:
          DP_MONGO_DB_HOST: localhost
          DP_MONGO_DB_PORT: "27017"
          DP_MONGO_DB_USER: admin
          DP_MONGO_DB_PASSWORD: admin
        run: |
          mvn -B clean verify

      - name: Tear down services
        if: always()
        run: |
          docker compose -f docker-compose.yaml down -v || true

      - name: Prepare release artifacts
        run: |
          set -euo pipefail
          mkdir -p release
          SHADED_JAR=$(ls target/dp-service-*-shaded.jar)
          cp "$SHADED_JAR" "release/dp-service-${VERSION}.jar"

      - name: Verify release artifacts
        run: |
          set -euo pipefail
          test -f "release/dp-service-${VERSION}.jar" || \
            (echo "Missing dp-service-${VERSION}.jar" && exit 1)

      # The notes file travels with the jar so the publish job can use it as body_path without
      # a second checkout.  On a rehearsal there is no notes file, so a placeholder is staged
      # instead: the upload below treats a missing path as an error, and a rehearsal should fail
      # on a real problem, not on the absence of something it was never going to publish.
      #
      # Gated on IS_RELEASE rather than GITHUB_REF_TYPE: NOTES_PATH is set only by the
      # release-only step above, so a workflow_dispatch run against a tag would reference it
      # unset and abort the rehearsal under `set -u` before anything is uploaded.  "Derive
      # version" now refuses such a run first; this gate should not depend on that.
      - name: Stage release notes
        run: |
          set -euo pipefail
          if [ "${IS_RELEASE}" = "true" ]; then
            cp "${NOTES_PATH}" release/RELEASE_NOTES.md
          else
            echo "Rehearsal run -- not a release; no notes staged." > release/RELEASE_NOTES.md
          fi

      - name: Upload build outputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-outputs
          path: |
            release/dp-service-${{ env.VERSION }}.jar
            release/RELEASE_NOTES.md
          if-no-files-found: error
          retention-days: 7

  sign:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # Sigstore keyless OIDC; the only job that has it

    # No checkout, and nothing from the repository runs here (see the comment above `jobs:`).
    # VERSION is repository content on a rehearsal, so it is read through the environment and
    # quoted in shell, never spliced into a script with ${{ }}.
    env:
      VERSION: ${{ needs.build.outputs.version }}

    steps:
      - name: Download build outputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-outputs
          path: release

      # working-directory matters here: sha256sum records the path it was given, so generating
      # from inside release/ produces bare filenames.  Consumers verify in a download directory
      # with no release/ subdirectory, and the `release/dp-service-...` entry every .sha256
      # through 1.16.0 recorded made `sha256sum -c` fail for them.
      - name: Generate SHA256SUMS
        working-directory: release
        run: |
          set -euo pipefail
          sha256sum "dp-service-${VERSION}.jar" > SHA256SUMS
          cat SHA256SUMS

      # cosign-release is pinned rather than taken from the installer's default, which moves
      # with the installer under a Dependabot bump.  release-image.yml pins the same version,
      # and README.env names it as the version the signatures were produced with.
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.0.6'

      # One signature over the consolidated checksum file covers every artifact it lists.
      - name: Sign checksums
        working-directory: release
        run: |
          set -euo pipefail
          cosign sign-blob --yes \
            --bundle SHA256SUMS.cosign.bundle \
            SHA256SUMS

      - name: Upload signatures
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signatures
          path: |
            release/SHA256SUMS
            release/SHA256SUMS.cosign.bundle
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [build, sign]
    # Only a rel-* tag push publishes; a workflow_dispatch rehearsal stops after signing.
    # Textually identical to the build job's IS_RELEASE -- keep the two in step.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/rel-')
    runs-on: ubuntu-latest
    permissions:
      contents: write   # release write; no signing token in scope

    env:
      VERSION: ${{ needs.build.outputs.version }}

    steps:
      - name: Download build outputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-outputs
          path: release

      - name: Download signatures
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: signatures
          path: release

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            release/dp-service-${{ env.VERSION }}.jar
            release/SHA256SUMS
            release/SHA256SUMS.cosign.bundle
          # The hand-written notes are the release body verbatim; see CLAUDE.md "Releases".
          body_path: release/RELEASE_NOTES.md
          # Without this a glob matching nothing publishes a release quietly missing an
          # asset -- here, potentially a release with no signature and no failure.
          fail_on_unmatched_files: true
          # Overwrites assets of the SAME name; it does not remove assets whose names are no
          # longer produced.  Re-cutting a tag from before signing would therefore leave that
          # release's dp-service-<version>.jar.sha256 sitting beside the new SHA256SUMS --
          # unsigned, and recording the old broken `release/`-prefixed path.  Delete the stale
          # .sha256 asset by hand before re-cutting any tag up to 1.16.0.
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
