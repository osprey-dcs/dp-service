## uncomment for testing replica set connection via URI
## MongoClient: Settings for connection to MongoDB.
#MongoClient:
#
#  # MongoClient.dbUri: URI for connecting to MongoDB.
#  # This resource is required, and if not provided, the URI is assembled from the resources for host, port, user, and password.
#  dbUri: mongodb://admin:admin@localhost:27017/?replicaSet=rs0&authSource=admin

MongoClient:
  testDatabaseName: ${DP_MONGO_TEST_DB_NAME:dp-test}
  # Mirrors the main application.yml key so tests exercise the same default; see that file for docs.
  # Left enabled under test: MongoTestClient drops and recreates the database for every test, so this
  # exercises the fresh-install path on every run — which is the path production installs take too.
  runSchemaMigrationsOnStartup: ${DP_MONGO_RUN_SCHEMA_MIGRATIONS_ON_STARTUP:true}

# Buckets: Invariants of the buckets collection shared by ingestion and query.
# Mirrors the main application.yml key so tests exercise the same defaults; see that file for docs.
Buckets:
  maxBucketSpanSeconds: ${DP_BUCKETS_MAX_BUCKET_SPAN_SECONDS:86400}
  # Off by default under test: the buckets collection is cleaned and repopulated between tests, so a
  # startup scan would verify an empty collection. BucketSpanVerifierTest exercises the check directly.
  verifyBucketSpansOnStartup: ${DP_BUCKETS_VERIFY_SPANS_ON_STARTUP:false}

# QueryHandler: Query Service request handler settings (Query API V2 paging/resolution limits).
# Mirrors the main application.yml keys so tests exercise the same defaults; see that file for docs.
QueryHandler:
  queryV2DefaultPageSize: ${DP_QUERY_HANDLER_QUERY_V2_DEFAULT_PAGE_SIZE:10000}
  queryV2MaxPageSize: ${DP_QUERY_HANDLER_QUERY_V2_MAX_PAGE_SIZE:100000}
  queryV2MaxResolvedPvCount: ${DP_QUERY_HANDLER_QUERY_V2_MAX_RESOLVED_PV_COUNT:10000}

# AnnotationHandler: Annotation Service request handler settings (sample status paging/size limits).
# Mirrors the main application.yml keys so tests exercise the same defaults; see that file for docs.
AnnotationHandler:
  sampleStatusQueryDefaultPageSize: ${DP_ANNOTATION_HANDLER_SAMPLE_STATUS_QUERY_DEFAULT_PAGE_SIZE:10000}
  sampleStatusQueryMaxPageSize: ${DP_ANNOTATION_HANDLER_SAMPLE_STATUS_QUERY_MAX_PAGE_SIZE:100000}
  sampleStatusSaveMaxStatuses: ${DP_ANNOTATION_HANDLER_SAMPLE_STATUS_SAVE_MAX_STATUSES:1000000}

Level1:
  Level2:
    intValue: 60
    longValue: 1698767462
    floatValue: 42.42
    doubleValue: 3.14159265
    stringValue: junk
    booleanValueTrue: trUE
    booleanValueFalse: faLse
    booeanValueUnknown: unknown
    noValue:

# Export: Settings for the export mechanism.
Export:

  # serverMountPoint: Target base directory mounted to machine running Annotation Service for export output files.
  # Setting must be specified to use the export feature.  Export requests will return an error response if not specified.
  # E.g., "/opt/dp/export".
  serverMountPoint: /tmp

  # shareMountPoint: Client-accessible directory for accessing export output files, if different than serverMountPoint.
  # Defaults to serverMountPoint if not specified.
  # E.g., "/share/dp/export".
  shareMountPoint:

  # urlBase: Optional base URL for accessing export output files.
  # Requires a web-server providing access to files at the specified location.
  # E.g., "https://www.facility.gov/dp/export".
  urlBase:
